- abs: We introduce SOLE-R1, a video-language reasoning model designed to provide reward signals for online reinforcement learning in robotics. The model processes raw video observations and natural-language goals to perform spatiotemporal chain-of-thought reasoning and generate dense task progress estimates usable as rewards. SOLE-R1 is trained using a large-scale synthesis pipeline that creates temporally grounded reasoning traces with continuous progress supervision, combining foundational spatial and temporal reasoning through supervised fine-tuning and RL from verifiable rewards. Testing across four simulation environments and real-robot settings, SOLE-R1 enables zero-shot online RL from random initialization without ground-truth rewards, success indicators, demonstrations, or task-specific tuning. The model succeeds on 24 unseen tasks and outperforms strong baselines including GPT-5 and Gemini-3-Pro while showing greater robustness to reward hacking.
