- abs: We investigate what occurs when a pretrained generative robot policy receives a constant initial noise vector instead of repeatedly sampling from a Gaussian distribution. We demonstrate that performance of a pretrained, frozen diffusion or flow matching policy can be enhanced for downstream rewards by replacing the standard practice of sampling initial noise from a prior distribution with a carefully selected, constant initial noise input—termed a "golden ticket." We propose simple search methods using Monte-Carlo policy evaluation to identify golden tickets. This approach keeps the pretrained policy frozen, requires no new network training, applies to all diffusion/flow matching policies, and only needs the ability to inject initial noise and calculate sparse task rewards from episode rollouts. The method improves performance in 46 out of 51 tasks across simulated and real-world robot manipulation benchmarks, with up to 55% absolute improvement in success rates for some simulated tasks, 28% improvement within 60 search episodes for real-world tasks, and 14% average performance boost across 7 tasks in multi-task settings using a single noise vector. Golden tickets optimized for one task can also transfer to improve related tasks.
