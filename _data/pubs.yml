- abs: Vision-language models struggle with reasoning over extended video sequences, which limits their use in embodied settings. We propose ROVER (Reasoning Over VidEo Recursively), which enables the model to recursively decompose long-horizon video trajectories into segments corresponding to shorter subtasks. The framework was evaluated on OpenX Embodiment videos and a new dataset with 543 videos across 27 robotic manipulation tasks. ROVER exceeded baseline performance on three video reasoning tasks&#58; task progress estimation, frame-level natural language reasoning, and video question answering. The recursive decomposition approach mitigates hallucinations, especially during unexpected or non-optimal moments of a trajectory, and achieves linear time complexity scaling with video length.
